[package]
name = "resume"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "resume"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["blocking", "json"] }
dotenvy = "0.15"
